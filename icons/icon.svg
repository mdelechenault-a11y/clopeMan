    <polygon points="150,226 236,226 222,244 238,258 220,272 236,286 150,286" fill="#fff" stroke="#1d1d1f" stroke-width="12" stroke-linejoin="round" />
  </g>
  <!-- right half -->
  <g transform="rotate(24 256 256)">
    <polygon points="276,226 380,226 380,286 276,286 292,272 274,258 290,244" fill="#fff" stroke="#1d1d1f" stroke-width="12" stroke-linejoin="round" />
    <rect x="380" y="226" width="40" height="60" rx="6" fill="#adb5bd" stroke="#1d1d1f" stroke-width="12" />
  </g>
</svg>
